<body data-root="../" data-section="anime">
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana sayfa"></a>
    <span class="bar-title" aria-hidden="true">Anime</span>
    <div class="bar-actions">
      <a class="btn glass bar-stats-btn" href="istatistik/" title="Anime İstatistikleri" aria-label="Anime İstatistikleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></a>
      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="hero"><h1>Anime</h1></section>
  <section class="stats glass sq" id="stats" hidden></section>
  <div class="tools">
    <label class="search glass">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.2 4.2"/></svg>
      <input id="q" type="search" placeholder="Ara" aria-label="Ada göre ara" autocomplete="off">
    </label>
    <div class="pick glass">
      <select id="sort" aria-label="Sıralama">
        <option value="added">Son eklenen</option>
        <option value="score">Puan (Yüksekten Düşüğe)</option>
        <option value="score-asc">Puan (Düşükten Yükseğe)</option>
        <option value="title">Ad (A–Z)</option>
        <option value="year">Çıkış yılı</option>
        <option value="eps">Bölüm sayısı</option>
      </select>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
    </div>
    <div class="view glass" role="group" aria-label="Görünüm">
      <button type="button" data-view="grid" data-icon="grid" aria-label="Kart" title="Izgara Görünümü"></button>
      <button type="button" data-view="list" data-icon="list" aria-label="Liste" title="Liste Görünümü"></button>
      <button type="button" data-view="tier" data-icon="tier" aria-label="Katman (Tier List)" title="Katman (Tier List) Görünümü"></button>
    </div>
    <button class="btn glass" id="randomPickBtn" type="button" data-icon="dice" aria-label="Rastgele Seç" title="Rastgele bir anime seç (🎲)"></button>
    <span class="fw"><button class="btn glass" id="fbtn" type="button" aria-expanded="false" aria-controls="fp" aria-label="Filtreler" data-icon="filter"></button><i class="dotn" id="fdot" hidden></i></span>
  </div>
  <div class="fp" id="fp"><div class="fp-in" id="fpIn"></div></div>
  <div class="chips" id="chips" role="group" aria-label="Duruma göre filtre"></div>
  <div id="tierBoard" class="tier-board" hidden></div>
  <ul id="list" class="grid"></ul>
  <p id="empty" class="note" hidden></p>
  <noscript><p class="note">Liste için JavaScript gerekiyor.</p></noscript>
  <p class="foot">AniList'ten günde bir güncellenir. Kapaklar sahiplerine aittir.</p>
