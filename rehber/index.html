<body data-root="../" data-section="guide" data-data="../data/guides.json">
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana sayfa"></a>
    <span class="bar-title">Rehber</span>
    <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Rehber</h1>
    <p class="sub" id="guidePageSub" style="margin-top:4px;font-size:.98rem">Technopat Sosyal üzerinde yayınladığım rehber ve incelemelerin kataloğu.</p>
  </div>

  <div id="stats" class="stats glass sq" hidden></div>

  <div class="tools">
    <label class="search glass">
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Rehber başlığı, konu veya kategori ara..." autocomplete="off">
    </label>
    <div class="pick glass">
      <select id="sort" aria-label="Sıralama">
        <option value="added">En yeni</option>
        <option value="title">Başlık (A–Z)</option>
        <option value="fav">Öne çıkanlar</option>
      </select>
      <span data-icon="chev"></span>
    </div>
    <button class="btn glass" id="randomPickBtn" type="button" data-icon="dice" aria-label="Rastgele Rehber Seç" title="Rastgele bir rehber seç (🎲)" style="width:48px;height:48px"></button>
  </div>

  <div id="chips" class="chips" role="group" aria-label="Kategori filtresi"></div>

  <ul id="guideList" class="tiles guide-catalog-grid"></ul>
  <p id="empty" class="note" hidden>Henüz rehber eklenmemiş veya aramayla eşleşen rehber yok.</p>

  <p class="foot">Rehber kartlarına tıkladığınızda Technopat Sosyal üzerindeki ilgili konuya yönlendirilirsiniz.</p>
</main>

<nav id="dock" class="dock glass" aria-label="Bölümler" hidden></nav>
