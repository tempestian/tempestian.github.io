# ============================================================================
# [AI-MIMARI: ANILIST KAPAK & İLİŞKİLİ İÇERİK SENKRONİZASYONU]
# Bu iş akışı hem haftalık otomatik zamanlayıcıyla hem de Admin Panelindeki
# tetikleyiciyle sorunsuz çalışır. [skip ci] etiketiyle yarış durumunu önler.
# ============================================================================
name: Bağlantılı Anime & Kapak Senkronu

on:
  schedule:
    - cron: '17 3 * * 0' # Her Pazar 03:17 UTC
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Senkronizasyon modu (relations_only / hybrid)'
        required: false
        default: 'relations_only'
        type: choice
        options:
          - relations_only
          - hybrid

permissions:
  contents: write

concurrency:
  group: sync-anilist
  cancel-in-progress: false

jobs:
  sync:
    name: AniList İlişkili İçerik ve Kapak Senkronu
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bot Commit Kontrolü
        id: check_bot
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          if ([ "$LAST_AUTHOR" = "github-actions[bot]" ] || echo "$LAST_MSG" | grep -q "\[skip ci\]") && [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Node.js 22 Kurulumu
        if: steps.check_bot.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: AniList İlişkili İçerikleri ve Kapakları Çek
        if: steps.check_bot.outputs.skip != 'true'
        env:
          ANILIST_USER: TurkTempestian
          CUSTOM_LIST: ''
          INCLUDE_PLANNED: '0'
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'relations_only' }}
        run: node scripts/sync-anilist.mjs

      - name: Veri Bütünlüğü Doğrulaması
        if: steps.check_bot.outputs.skip != 'true'
        run: node scripts/validate-data.mjs

      - name: Değişiklik Varsa Kaydet ve Gönder
        if: steps.check_bot.outputs.skip != 'true'
        run: |
          for p in data/anime.json a d f m k; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(media): kapak, yan icerik ve paylasim kartlari senkronu [skip ci]"
          git pull --rebase origin main
          git push
