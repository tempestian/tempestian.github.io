# ============================================================================
# [AI-MIMARI-NOTU: ADIM 6 & 10 — ANILIST PROFİLİNDEN BAĞIMSIZ KAPAK & YAN İÇERİK SENKRONU]
# Bu iş akışı (`sync-anilist.yml`) Adım 10 itibarıyla varsayılan olarak `relations_only`
# modunda çalışır:
# - Kullanıcının AniList profil listesine (`MediaListCollection`) bakmaz; yeni girdiler
#   yalnızca sitenin kendi Admin Panelinden eklenir.
# - `data/anime.json` içindeki her animenin İlk Sezon AniList Linki (`firstSeasonUrl`)
#   üzerinden kapak görseli CDN URL'lerini ve yeni çıkan sezon, film ve yan içerikleri
#   (`PREQUEL`, `SEQUEL`, `SIDE_STORY`, `PARENT`, `SUMMARY`, `SPIN_OFF`) çekip günceller.
# ============================================================================
name: Bağlantılı Anime & Kapak Senkronu

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Senkronizasyon modu (relations_only: Sadece sitedeki animelerin kapak ve yan içeriklerini çek | hybrid: AniList profil listesini de dahil et)'
        required: false
        default: 'relations_only'
        type: choice
        options:
          - relations_only
          - hybrid

permissions:
  contents: write

concurrency:
  group: sync-anilist
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bot commit kontrolü (Sonsuz döngü koruması)
        id: check_bot
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ] && [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-node@v4
        if: steps.check_bot.outputs.skip != 'true'
        with:
          node-version: 22

      - name: İlk sezon linklerinden kapak URL ve yan içerikleri çek
        if: steps.check_bot.outputs.skip != 'true'
        env:
          ANILIST_USER: TurkTempestian
          CUSTOM_LIST: ''
          INCLUDE_PLANNED: '0'
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'relations_only' }}
        run: node scripts/sync-anilist.mjs

      - name: Veri ve İçerik Bütünlüğü Doğrulaması (Güvenlik Ön Koşulu)
        if: steps.check_bot.outputs.skip != 'true'
        run: node scripts/validate-data.mjs

      - name: Değişiklik varsa kaydet
        if: steps.check_bot.outputs.skip != 'true'
        run: |
          if git diff --quiet data/anime.json a/ d/ f/ m/ k/ 2>/dev/null; then exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anime.json a/ d/ f/ m/ k/ 2>/dev/null || true
          git commit -m "chore(media): kapak, yan icerik ve paylasim kartlari senkronu [skip ci]"
          git pull --rebase origin main
          git push

