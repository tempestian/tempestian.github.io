<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>İyi ki doğdun miniğim 🐾</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
<link rel="icon" href="../assets/img/favicon-32.png" type="image/png" sizes="32x32">
<style>
:root{
  /* Kırmızı & Bordo Aşk Paleti */
  --bg-deep:#18060c;
  --bg-dark:#2c0c16;
  --bg-crimson:#4a1220;
  --paper-red-1:#fff3f5;
  --paper-red-2:#fae1e6;
  --book-edge:#8a1d35;
  --fg:#300a14;
  --accent-red:#b51d3b;
  --accent-ruby:#dc264e;
  --accent-soft:#ffb3c1;
  --gold-ribbon:#f7c873;
  --shadow:rgba(20,2,6,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;margin:0;overflow:hidden;
  background:radial-gradient(ellipse at bottom, var(--bg-dark) 0%, var(--bg-deep) 100%);
  color:#fff;font-family:system-ui,-apple-system,sans-serif;user-select:none;
}

/* Parıltı & Kalp Tozu Tuvali */
#stars-canvas{position:fixed;inset:0;pointer-events:none;z-index:0}

/* Kilit Ekranı (Geri sayım bitmediyse ve backdoor aktif değilse) */
#lock-screen{
  position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(24,6,12,.96);backdrop-filter:blur(24px);padding:24px;text-align:center;
}
.lock-box{
  max-width:440px;width:100%;padding:36px 28px;border-radius:28px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,179,193,.2);
  box-shadow:0 24px 60px rgba(0,0,0,.65);animation:fadeIn .7s ease;
}
.lock-cat{font-size:54px;display:inline-block;animation:paws 2.2s infinite ease-in-out}
.lock-title{font-family:'Caveat',cursive;font-size:2.3rem;color:var(--accent-soft);margin:14px 0 6px}
.lock-desc{font-size:.96rem;color:rgba(255,255,255,.8);line-height:1.6;margin-bottom:20px}
.lock-timer{display:flex;gap:12px;justify-content:center;margin:16px 0}
.lock-col{background:rgba(0,0,0,.45);padding:10px 14px;border-radius:14px;min-width:68px;border:1px solid rgba(220,38,78,.25)}
.lock-col b{display:block;font-size:1.65rem;color:#fff;font-family:'Playfair Display',serif}
.lock-col span{font-size:.75rem;color:var(--accent-soft);text-transform:uppercase;letter-spacing:.5px}
.lock-back{margin-top:22px;display:inline-flex;align-items:center;gap:6px;color:rgba(255,255,255,.65);text-decoration:none;font-size:.88rem;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.08);transition:.2s}
.lock-back:hover{color:#fff;background:rgba(220,38,78,.3)}

/* Ana Uygulama */
.app-container{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:2;padding:12px}

/* Üst Kontrol Barı */
.top-nav{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;
  display:flex;justify-content:space-between;align-items:center;z-index:30;pointer-events:auto;
}
.brand-tag{
  display:flex;align-items:center;gap:8px;font-family:'Caveat',cursive;font-size:1.45rem;color:var(--accent-soft);
  background:rgba(74,18,32,.5);padding:6px 16px 6px 12px;border-radius:99px;border:1px solid rgba(255,179,193,.25);backdrop-filter:blur(10px);
}
.brand-tag span.cat{font-size:1.25rem;animation:tail 1.8s ease-in-out infinite alternate;display:inline-block}
.nav-actions{display:flex;gap:10px}
.icon-btn{
  width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,179,193,.25);
  background:rgba(74,18,32,.45);color:#fff;font-size:1.15rem;display:grid;place-items:center;
  cursor:pointer;backdrop-filter:blur(10px);transition:transform .2s,background .2s;
}
.icon-btn:hover{background:rgba(220,38,78,.35);transform:scale(1.08)}
.icon-btn:active{transform:scale(.95)}

/* Kitap Sahnesi & 3D Çevirme Perspektifi */
.stage{
  position:relative;width:100%;max-width:540px;height:84vh;max-height:780px;
  display:flex;align-items:center;justify-content:center;perspective:2200px;
}
@media (max-width:600px){
  .stage{height:88vh;max-height:none;padding-top:40px}
}

/* Kitap Cildi / Dış Gövde */
.book-spine{
  position:relative;width:100%;height:100%;max-width:480px;
  background:linear-gradient(135deg, #440e1b, #20050c);
  border-radius:20px;padding:8px;
  box-shadow:0 26px 70px rgba(0,0,0,.75), 0 6px 20px rgba(74,18,32,.4);
  display:flex;perspective:1800px;
}

/* Kitap Sayfa Desteği (Basılı kitap kenarları) */
.book-wrapper{
  position:relative;width:100%;height:100%;
  background:linear-gradient(135deg, var(--paper-red-2), var(--paper-red-1));
  border-radius:14px;
  border:1px solid rgba(255,255,255,.8);
  box-shadow:inset 0 0 35px rgba(181,29,59,.07);
  display:flex;flex-direction:column;overflow:hidden;
  transform-style:preserve-3d;
}

/* Gerçek Sayfa Katlanma / Cilt Gölgeleri */
.book-wrapper::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:38px;
  background:linear-gradient(90deg, rgba(74,18,32,.22) 0%, rgba(74,18,32,.08) 45%, transparent 100%);
  pointer-events:none;z-index:10;
}
.book-wrapper::after{
  content:"";position:absolute;right:0;top:0;bottom:0;width:14px;
  background:linear-gradient(270deg, rgba(74,18,32,.12) 0%, transparent 100%);
  pointer-events:none;z-index:10;
}

/* Sayfa Çevirme Animasyonları (Gerçek Basılı Kitap Hissi) */
.page-flip-next{
  animation:pageTurnNext .58s cubic-bezier(.25, .8, .25, 1) both;
  transform-origin:left center;
}
.page-flip-prev{
  animation:pageTurnPrev .58s cubic-bezier(.25, .8, .25, 1) both;
  transform-origin:right center;
}

@keyframes pageTurnNext{
  0%{opacity:0;transform:rotateY(-24deg) translateX(30px);filter:brightness(.92)}
  50%{transform:rotateY(-8deg) translateX(10px);filter:brightness(1.04)}
  100%{opacity:1;transform:rotateY(0deg) translateX(0);filter:brightness(1)}
}
@keyframes pageTurnPrev{
  0%{opacity:0;transform:rotateY(24deg) translateX(-30px);filter:brightness(.92)}
  50%{transform:rotateY(8deg) translateX(-10px);filter:brightness(1.04)}
  100%{opacity:1;transform:rotateY(0deg) translateX(0);filter:brightness(1)}
}

/* Sayfa Görünümü ve Metin */
.page-viewport{
  flex:1;overflow-y:auto;overflow-x:hidden;padding:46px 36px 68px;
  color:var(--fg);font-family:'Lora',serif;line-height:1.85;font-size:1.06rem;
  scrollbar-width:thin;scrollbar-color:var(--accent-soft) transparent;
  display:flex;flex-direction:column;justify-content:center;
}
@media (max-width:500px){
  .page-viewport{padding:36px 24px 58px;font-size:1rem;line-height:1.76}
}
.page-viewport::-webkit-scrollbar{width:5px}
.page-viewport::-webkit-scrollbar-thumb{background:var(--accent-soft);border-radius:10px}

/* Kapak Görünümü */
.cover-content{text-align:center;padding:20px 0}
.cover-cat-badge{
  width:88px;height:88px;margin:0 auto 16px;border-radius:50%;
  background:radial-gradient(circle, #fff0f3 0%, #ffd0db 100%);
  display:grid;place-items:center;font-size:44px;
  box-shadow:0 8px 24px rgba(181,29,59,.25);
  animation:float 3.5s ease-in-out infinite;border:2px dashed var(--accent-red);
}
.cover-title{
  font-family:'Caveat',cursive;font-size:3.3rem;line-height:1.08;color:var(--accent-red);
  margin:10px 0 12px;font-weight:700;letter-spacing:-.5px;
}
.cover-orn{font-size:2rem;color:var(--accent-red);opacity:.8;margin:6px 0}
.cover-sub{font-size:1.26rem;font-style:italic;color:#6d1c2e;margin:0}
.cover-tip{
  margin-top:42px;font-family:system-ui,-apple-system,sans-serif;font-size:.85rem;color:#872b3e;
  display:inline-flex;align-items:center;gap:6px;background:rgba(181,29,59,.08);padding:8px 20px;border-radius:99px;
  animation:pulse 2s infinite ease-in-out;
}

/* Sayfa İçerik Başlık & Gövdesi */
.page-head{text-align:center;margin-bottom:18px}
.page-title{font-family:'Playfair Display',serif;font-weight:600;font-size:1.55rem;color:var(--accent-red);margin:0}
.rulewrap{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 0 16px}
.rulewrap .line{height:1px;width:34px;background:var(--accent-red);opacity:.6}
.rulewrap .paw{font-size:13px;opacity:.75;color:var(--accent-red)}
.page-text{white-space:pre-wrap;overflow-wrap:break-word;word-break:normal}
.page-text.align-left{text-align:left}
.page-text.align-center{text-align:center}

/* Kedi Karakter & Sayfa Bazlı Dinamik Konuşma */
.cat-mascot{
  position:absolute;bottom:-18px;right:22px;z-index:25;cursor:pointer;
  display:flex;align-items:flex-end;gap:4px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35));
  transition:transform .2s ease;
}
.cat-mascot:hover{transform:translateY(-6px) scale(1.1)}
.cat-mascot .cat-body{font-size:40px;animation:paws 3s infinite ease-in-out}
.cat-speech{
  position:absolute;bottom:50px;right:0;background:#fff;color:#380713;
  padding:7px 14px;border-radius:16px;border-bottom-right-radius:2px;
  font-family:'Caveat',cursive;font-size:1.18rem;font-weight:700;white-space:nowrap;
  box-shadow:0 8px 24px rgba(74,18,32,.25);border:1px solid rgba(220,38,78,.2);
  opacity:0;transform:translateY(8px) scale(.92);pointer-events:none;
  transition:all .35s cubic-bezier(.175,.885,.32,1.275);
}
.cat-speech.show{opacity:1;transform:translateY(0) scale(1)}

/* Alt İlerleme & Gezinme Çubuğu */
.bottom-bar{
  position:absolute;bottom:14px;left:20px;right:20px;
  display:flex;align-items:center;justify-content:space-between;
  z-index:20;pointer-events:none;
}
.page-num{
  font-family:system-ui,-apple-system,sans-serif;font-size:.85rem;font-weight:600;
  color:#611827;background:rgba(255,255,255,.8);padding:3px 12px;border-radius:99px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);border:1px solid rgba(181,29,59,.15);
}
.progress-rail{
  flex:1;max-width:140px;margin:0 14px;height:5px;background:rgba(181,29,59,.16);border-radius:99px;overflow:hidden;
}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg, #ff8ca3, var(--accent-ruby));transition:width .4s ease}

/* Yan Gezinme Butonları (Masaüstü) */
.nav-arrow{
  position:absolute;top:50%;transform:translateY(-50%);width:52px;height:52px;border-radius:50%;
  background:rgba(74,18,32,.5);border:1px solid rgba(255,179,193,.3);color:#fff;font-size:1.8rem;
  display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px);z-index:28;
  transition:all .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.4);
}
.nav-arrow:hover{background:rgba(220,38,78,.45);transform:translateY(-50%) scale(1.1)}
.nav-arrow:active{transform:translateY(-50%) scale(.95)}
.nav-arrow.prev{left:-72px}
.nav-arrow.next{right:-72px}
@media (max-width:680px){
  .nav-arrow{display:none}
}

/* Kalp & Konfeti Efektleri */
.floating-heart{
  position:fixed;pointer-events:none;z-index:90;font-size:24px;
  animation:heartFly 2.2s cubic-bezier(.25,1,.5,1) forwards;
}
@keyframes heartFly{
  0%{opacity:1;transform:translate(0,0) scale(.6) rotate(0deg)}
  50%{opacity:.9;transform:translate(var(--tx), -70px) scale(1.2) rotate(15deg)}
  100%{opacity:0;transform:translate(calc(var(--tx) * 1.5), -160px) scale(.8) rotate(-15deg)}
}

/* Temel Animasyonlar */
@keyframes fadeIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes pulse{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
@keyframes paws{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes tail{0%{transform:rotate(-12deg)}100%{transform:rotate(14deg)}}
</style>
</head>
<body>

<canvas id="stars-canvas"></canvas>

<!-- Kilit & Geri Sayım Ekranı -->
<div id="lock-screen" style="display:none">
  <div class="lock-box">

      <a href="../" class="icon-btn" title="Ana Sayfa" aria-label="Kapat" style="text-decoration:none">✕</a>
    </div>
  </header>

  <main class="stage">
    <button class="nav-arrow prev" id="arrow-prev" title="Önceki Sayfa" aria-label="Önceki">‹</button>

        </footer>
      </div>
    </div>

    <button class="nav-arrow next" id="arrow-next" title="Sonraki Sayfa" aria-label="Sonraki">›</button>
  </main>
</div>

      "text": "Sen anlamazsın beni,\nSeni ne kadar sevdiğimi.\nGözümden gör isterdim,\nGözlerimdeki seni.\n\nSen anlamazsın beni,\nAnlatmak isterdim uzun uzun;\nZamanı durdurabilseydim,\nVaktim yeterdi belki..."
    },
    {
      "title": "Keşke burada olsaydın...",
      "text": "Gün içinde güldüğüm anlar oluyor;\niçimden \"yanımda olsaydı\" demek geçiyor,\no anı beraber yaşasak, birlikte gülsek diyorum.\n\nGün içinde ağladığım anlar oluyor;\n\"yanımda olsaydı\" diyorum,\nsadece sarılsa yeterdi...\nNe yaşarsam yaşayayım,\naklım da kalbim de hep sende kalıyor."
    },
    {
      "title": "Beklemeye değer...",
      "text": "Zor, biliyorum.\nBazen günler gerçekten geçmek bilmiyor.\nAraya giren haftalar, aylar\ninsanın sabrını sınıyor gibi geliyor\nama seni beklemekten hiç gocunmuyorum.\nHer takvim yaprağında,\nkavuşacağımız o güne bir adım daha yaklaşıyorum.\nÇünkü sonunda ellerini tutacağımı bilmek;\naradaki her güne,\nher kilometreye fazlasıyla değiyor."
    },
    {
      "title": "Mesafeler...",
      "text": "Aramızda yüzlerce kilometre var,\nbazen sadece bir ses,\nbazen birkaç satır yazı\nama ne zaman gözlerimi kapatsam yanımdasın sanki.\n\nNe sokaklar engel olabiliyor buna\nne de aradaki bu yollar.\nBiliyorum miniğim,\nbu ekranlar bir gün kapanacak\nve ben sadece sana bakacağım."
    },
    {
      "title": "Beraber geçirdiğimiz vakitler...",
      "text": "Seninle beraber anime, film izlemek...\nBirlikte aynı şarkıları dinlemek...\nSeninle yaptığım her şey \ndaha bir anlam kazanıyor hayatımda.\nSeninle vakit geçirmeyi \nher şeyden daha çok seviyorum.\n\nYan yana olduğumuzu hayal ediyorum;\nel ele tutuşarak izleyebilirdik filmleri,\naynı kulaklıktan dinleyebilirdik şarkıları,\naynı kitabın sayfalarını çevirebilirdik\nama en önemlisi:\nGözlerine bakarak söyleyebilirdim\nseni sevdiğimi..."
    },
    {
      "title": "Seni her şeyden daha fazla seviyorum...",
      "text": "Söylediklerimin sıradan olduğunu düşünme\nbu öyle alışkanlıktan ya da laf olsun diye\ndile gelen bir cümle değil.\nNasıl anlatırım bilmiyorum \nama şöyle düşün:\nGün içinde kafamı meşgul eden ne kadar dert varsa;\nkoşturmacalar, yorgunluklar, canımı sıkan insanlar...\nSen aklıma geldiğin an hepsi arka plana düşüyor.\nHayatımın tam ortasında sadece sen kalıyorsun."
    },
    {
      "title": "",
      "text": "Seni sevmek benim için bir seçenek ya da\nanlık bir heves olmadı hiç.\nZihnimin en kalabalık olduğu anda bile\niçime çöken o huzurun tek sebebi sensin.\nAramızdaki bu mesafenin yorduğu,\ngünlerin geçmek bilmediği anlarda bile\nsevgimden bir an olsun şüphe etmedim.\nAksine, her geçen gün daha da kök saldı içimde.\nHayatta güvendiğim ne varsa\nsenin varlığının yanında hafif kalıyor.\nGözümün gördüğü, kalbimin alabildiği her şeyden;\nevet miniğim, seni herkesten ve her şeyden\nçok daha fazla seviyorum."
    },
    {
      "title": "Ufak atışmalar...",
      "text": "Biliyor musun?\nSinirlendiğin zaman verdiğin tepkiyi \nçok seviyorum. \nİçinden bir canavar çıktığını düşünüyorsun belki ama ne kadar tatlı olduğunu fark edemiyorsun. Seninle tartışamıyorum çünkü o tatlı çıkışların sokakta minik bir kedi görmüş gibi gülümsetiyor beni. Belki çok sert olduğunu düşünüyorsun, fark etmiyorsun ne kadar sevimli olduğunu. Ne kadar kızarsan kız, o öfkeli hâllerini bile aşırı seviyorum."
    },
    {
      "title": "Çabuk barışmalar...",
      "text": "Öfke dediğin nedir ki aramızda,\nBir nefes boyu süren kısa bir parazit.\nSen kaşını çatmayı denersin ama\nİkimiz de biliriz uzatmanın yersizliğini.\n\nEkranın o soğuk mesafesi bile\nsesini duyduğum an delinir gider.\nKüs kalmayı beceremeyiz biz;\ngöz göze geldiğimiz an,\nbütün o sahte kıyametler\ntek bir gülüşle sessizce kapanır."
    },
    {
      "title": "Kavuştuktan sonra...",
      "text": "Bazen gözlerimi kapatıp kavuştuğumuz günlerin provasını yapıyorum kafamda.\nMesela sıradan bir pazar sabahı beraber kahvaltı hazırlamak,\nmarkette reyonlar arasında saçma sapan şeylere gülmek,\nyağmur yağdığında bir kafenin cam kenarına sığınıp sıcak bir şeyler içmek...\n\nBize sıradan gelen o küçük anlar, aslında benim en büyük hayalim.\nÇünkü biliyorum; seninle yaşanan en sıradan gün bile, sensiz geçen en parlak günden çok daha güzel olacak."
    },
    {
      "title": "İlk sarılış...",
      "text": "Bütün bu yollar tükendiğinde,\nEkranlar sustuğunda,\nVe takvimler nihayet o günü gösterdiğinde;\n\nSana ilk sarıldığım o saniyede,\nNe geçen zamanın hesabını soracağım\nNe de aramızdaki kilometrelerin.\n\nSadece kokunu çekeceğim içime,\nGözlerimi kapatıp fısıldayacağım:\n\"Geçti miniğim, bak buradayım.\""
    },
    {
      "title": "Sana sözüm olsun...",
      "text": "Hayat her zaman güllük gülistanlık\nolmayacak, biliyorum.\nYorulduğumuz, nefesimizin daraldığı\ngünler de gelecek ama sana söz veriyorum\nminiğim; ne olursa olsun ellerini\nasla bırakmayacağım.\nBu yolda ayağına taş değmesin diye\nönündeki yolları temizleyecek,\ndüştüğünde seni kaldıracak ilk el yine ben olacağım.\nElbet bizim de sınandığımız anlar olacak\nama birbirimize tutunduğumuz sürece\nhiçbir dert sevgimizden büyük olamaz."
    },
    {
      "title": "Fotoğrafına baktığımda...",
      "text": "Bazen saatlerce durup bir karesine bakıyorum gülüşünün.\nSanki ekran eriyip gidecek,\nSanki saçlarının kokusu dolacak odama.\n\nNe çok şey anlatır bir bakış,\nNe çok dert siler gözlerin...\nSen orada gülümsersin,\nBen burada yeniden başlarım yaşamaya."
    },
    {
      "title": "Bana kattıkların...",
      "text": "Hayatıma girdiğinden beri içimde uyuyan o neşeli çocuğu uyandırdın.\nDaha sabırlı olmayı, her şeye rağmen tebessüm edebilmeyi ve birini böylesine saf sevebilmeyi senden öğrendim ben.\n\nBir insanın kalbime bu kadar dokunabilmesi, beni her gün daha iyi biri olmaya heveslendirmesi ne büyük bir şans...\nSen bana sadece sevgini değil miniğim, yepyeni ve çok daha güzel bir ben hediye ettin."
    },
    {
      "title": "Uzak değilsin ki...",
      "text": "Araya giren şehirlere bakıyorum bazen;\nyollara, tabelalara, bitmek bilmeyen kilometrelere...\nSonra elimi sol yanıma koyuyorum;\noradasın.\n\nUzaklık dediğin haritada bir çizgiden ibaret miniğim.\nBen seni haritaların bittiği,\nkalbimin en derin başladığı yerde sakladım.\n\nNe yollar seni benden uzaklaştırabilir,\nne de zaman sevgimi eksiltebilir."
    },
    {
      "title": "Yıllar sonra bu sayfayı açtığımızda...",
      "text": "Biliyorum, bir gün gelecek ve biz bu kitabı\nyan yana oturmuş bir koltukta,\nellerimiz birbirine kenetliyken okuyacağız.\n\nSayfaları çevirirken o eski günleri,\nekran başında döktüğümüz gözyaşlarını,\nözlemden sızlayan içimizi hatırlayıp\nyüzümüzde gururlu bir tebessümle birbirimize bakacağız.\n\n\"Bak miniğim,\" diyeceğim sana,\n\"nasıl da sabrettik, nasıl da başardık...\"\nİşte o an, bu kitabın en güzel sayfası yazılmış olacak."
    },
    {
      "title": "",
      "text": "Dünyaya bir ışık gibi indiğin o gün,\nBenim karanlığımın biteceği günmüş meğer.\nÇok sonra kesişse de yollarımız,\nKader adını kalbime çoktan kazımış meğer.\n\nYeni yaşında gülüşün hiç solmasın,\nO minik kalbin keder nedir bilmesin.\nVarsın bu doğum gününde mesafeler girsin aramıza,\nHiçbir yol sevgimin sana ulaşmasını engelleyemez.\n\nİyi ki doğdun ruhumun diğer yarısı,\nİyi ki varsın miniğim...\nÖmrüm yettiğince, her yeni yaşında\nElini tutan yine ben olacağım."
    },
    {
      "title": "",
      "text": "Fark ettim ki miniğim,\nben bu kitabı istesem de bitiremem\nçünkü bu sıradan bir doğum günü hediyesi değil;\nbizim yaşayan, nefes alan hikayemiz.\nAşkımız sürdükçe bu satırlar da uzayıp gidecek,\nbiz yeni anılar biriktirdikçe\nbu kitaba hep yeni sayfalar eklenecek.\nBu bir son değil;\nseninle yazacağımız upuzun bir ömrün\nsadece ilk otuz sayfası...\n\nİyi ki doğdun miniğim,\nhikayemiz hiç bitmesin.",
      "align": "center"
    }
  ]
}
</script>

<script>
(function(){
  'use strict';
  const data = JSON.parse(document.getElementById('book-data').textContent);
  const targetMs = Date.parse(data.targetDate || '2026-10-27T00:00:00+03:00');
  const params = new URLSearchParams(window.location.search);
  
  // Arka kapı anahtarı kontrolü
  const isBackdoor = params.get('key') === data.secretKey || params.get('onizleme') === '1' || params.has('gizli');
  const isExpired = Date.now() >= targetMs;

  const lockScreen = document.getElementById('lock-screen');
  const bookApp = document.getElementById('book-app');

  if (!isExpired && !isBackdoor) {
    lockScreen.style.display = 'flex';
    initLockTimer();
    return;
  }

  // Kitabı Aç
  bookApp.style.display = 'flex';
  initBook();

  /* ---------- GERİ SAYIM MOTORU ---------- */
  function initLockTimer(){
    const pad = n => String(n).padStart(2,'0');
    const update = () => {
      const left = targetMs - Date.now();
      if(left <= 0){
        location.reload();
        return;
      }
      const s = Math.floor(left / 1000);
      document.getElementById('ld').textContent = String(Math.floor(s / 86400));
      document.getElementById('lh').textContent = pad(Math.floor(s % 86400 / 3600));
      document.getElementById('lm').textContent = pad(Math.floor(s % 3600 / 60));
      document.getElementById('ls').textContent = pad(s % 60);
    };
    update();
    setInterval(update, 1000);
  }

  /* ---------- KİTAP ETKİLEŞİM MOTORU ---------- */
  function initBook(){
    let cur = 0;
    const total = data.pages.length + 1; // Kapak + 30 sayfa
    const pageContent = document.getElementById('page-content');
    const pageNum = document.getElementById('page-num');
    const progressBar = document.getElementById('progress-bar');
    const arrowPrev = document.getElementById('arrow-prev');
    const arrowNext = document.getElementById('arrow-next');
    const mascot = document.getElementById('mascot');
    const speech = document.getElementById('mascot-speech');

    // Her sayfa içeriğiyle birebir uyumlu kedi replikleri (Kapak + 30 Sayfa = 31 replik)
    const pageCatDialogues = [
      "Mırrr... Bu özel kitabı senin için hazırladı 🐾❤️", // Kapak
      "Sıradan bir hediye sana yetmezdi miyav! 🎁", // Sayfa 1
      "Yazar kalbi sevgisini böyle döker işte 📖✨", // Sayfa 2
      "Özlemek bile seninle çok güzel miyav... 🥺", // Sayfa 3
      "Mesafelere inat o kavuşma anını bekliyor 🐾", // Sayfa 4
      "Günaydın mesajınla bütün günü aydınlanıyor ☀️❤️", // Sayfa 5
      "O şişeyi iyi ki atmışsın, kaderiniz kesişmiş! 🍾✨", // Sayfa 6
      "Güvenini kazanmak dünyalara bedelmiş miyav 🤍", // Sayfa 7
      "Keşke seni çok daha erken tanısaydı... 🌸", // Sayfa 8
      "İyi ki yollarınız kesişmiş miniğim 🐾", // Sayfa 9
      "Hayatına değil doğrudan içine doğmuşsun ❤️", // Sayfa 10
      "Gecenin sessizliğinde bile hep aklındasın 🌙", // Sayfa 11
      "Sana olan hislerini anlatmaya kelimeler yetmiyor 📜", // Sayfa 12
      "Gözlerindeki seni görsen çok şaşırırsın miyav! 🥺", // Sayfa 13
      "Aklı da kalbi de hep seninle atıyor 💓", // Sayfa 14
      "Seni beklemekten bir an bile gocunmuyor ⏳✨", // Sayfa 15
      "Bu ekranlar bir gün sonsuza dek kapanacak 🐾", // Sayfa 16
      "Birlikte anime ve film izleyeceğiniz o günler yakın! 🎬🎧", // Sayfa 17
      "Hayatının tam ortasında sadece sen varsın ❤️", // Sayfa 18
      "Gözünün gördüğü her şeyden çok seviyor seni 🐾", // Sayfa 19
      "Kızınca minik bir kediye benziyormuşsun, çok tatlısın! 😼🐾", // Sayfa 20
      "Küs kalmayı hiç beceremezsiniz ki siz miyav! 😸❤️", // Sayfa 21
      "Pazar sabahı kahvaltısı... En güzel hayalimiz 🥞☕", // Sayfa 22
      "O ilk sarılma anında bütün yollar susacak 🫂✨", // Sayfa 23
      "Ellerini hiçbir zaman bırakmayacak, söz verdi! 🤝❤️", // Sayfa 24
      "Fotoğrafına baktıkça içi kıpır kıpır oluyor 📸🥰", // Sayfa 25
      "Ona yepyeni ve çok güzel bir kalp verdin miniğim 🌿", // Sayfa 26
      "Uzak değilsin ki, tam sol yanında saklısın 📍❤️", // Sayfa 27
      "Yıllar sonra yan yana okuyacaksınız bu sayfaları 👵👴📖", // Sayfa 28
      "İyi ki doğdun ruhunun diğer yarısı! 🎂🎉🥳", // Sayfa 29
      "Ve bu hikaye sizinle sonsuza kadar sürecek miyav! 🐾❤️♾️" // Sayfa 30
    ];

    function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
    function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>');}

    let speechTimer = null;
    function showCatSpeech(text, duration = 3200){
      if(!speech) return;
      speech.textContent = text;
      speech.classList.add('show');
      if(speechTimer) clearTimeout(speechTimer);
      speechTimer = setTimeout(() => {
        speech.classList.remove('show');
      }, duration);
    }

    function render(dir){
      pageContent.innerHTML = '';
      
      // Basılı kitap sayfa çevirme efekti
      pageContent.className = 'page-viewport ' + (dir > 0 ? 'page-flip-next' : (dir < 0 ? 'page-flip-prev' : ''));

      if(cur === 0){
        // Kapak Sayfası
        pageContent.innerHTML = `
          <div class="cover-content">
            <div class="cover-cat-badge">🐾</div>
            <div class="cover-orn">❦</div>
            <h1 class="cover-title">${esc(data.cover.title)}</h1>
            <p class="cover-sub">${fmt(data.cover.subtitle)}</p>
            <div class="cover-tip">
              <span>👉 Sayfaları çevirmek için yana kaydır veya tıkla</span>
            </div>
          </div>
        `;
      } else {
        // Normal İçerik Sayfası
        const p = data.pages[cur - 1];
        const alignClass = p.align === 'center' ? 'align-center' : 'align-left';
        const titleHtml = p.title ? `
          <div class="page-head">
            <h2 class="page-title">${esc(p.title)}</h2>
            <div class="rulewrap">
              <span class="line"></span>
              <span class="paw">🐾</span>
              <span class="line"></span>
            </div>
          </div>
        ` : '';

        pageContent.innerHTML = `
          ${titleHtml}
          <div class="page-text ${alignClass}">${fmt(p.text)}</div>
        `;
      }

      pageNum.textContent = (cur === 0 ? 'Kapak' : cur) + ' / ' + (total - 1);
      progressBar.style.width = (cur / (total - 1) * 100) + '%';
      pageContent.scrollTop = 0;

      // Sayfa değişiminde kedi sayfa temasına özel konuşsun
      const dialogue = pageCatDialogues[cur] || "Seni çok seviyor miyav! 🐾";
      showCatSpeech(dialogue);
    }

    function go(idx, dir){
      if(idx < 0 || idx >= total) return;
      cur = idx;
      render(dir);
    }

    function next(){
      if(cur < total - 1) {
        spawnPaws();
        go(cur + 1, 1);
      }
    }
    function prev(){
      if(cur > 0) go(cur - 1, -1);
    }

    arrowPrev.addEventListener('click', prev);
    arrowNext.addEventListener('click', next);

    // Dokunmatik / Kaydırma (Swipe)
    let sx = 0, sy = 0;
    pageContent.addEventListener('touchstart', e => {
      sx = e.touches[0].clientX;
      sy = e.touches[0].clientY;
    }, {passive:true});

    pageContent.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - sx;
      const dy = e.changedTouches[0].clientY - sy;
      if(Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.35){
        dx < 0 ? next() : prev();
      }
    }, {passive:true});

    // Klavye Kısayolları
    window.addEventListener('keydown', e => {
      if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') next();
      else if(e.key === 'ArrowLeft' || e.key === 'PageUp') prev();
      else if(e.key === 'Home') go(0, -1);
      else if(e.key === 'End') go(total - 1, 1);
    });

    // Maskot Kediye Tıklama
    mascot.addEventListener('click', () => {
      const dialogue = pageCatDialogues[cur] || "Miyav! Seni dünyalar kadar seviyor ❤️";
      showCatSpeech(dialogue, 3500);
      spawnHearts(mascot.getBoundingClientRect().left + 20, mascot.getBoundingClientRect().top);
    });

    // Kalp Butonu
    const btnHeart = document.getElementById('btn-heart');
    btnHeart.addEventListener('click', () => {
      const rect = btnHeart.getBoundingClientRect();
      spawnHearts(rect.left + rect.width / 2, rect.top + rect.height / 2);
    });

    // Tam Ekran Butonu
    const btnFs = document.getElementById('btn-fs');
    btnFs.addEventListener('click', () => {
      if(!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(()=>{});
      } else {
        document.exitFullscreen().catch(()=>{});
      }
    });

    render(0);
  }

  /* ---------- ANİMASYONLU KALP & PATİ EFEKTLERİ ---------- */
  function spawnHearts(x, y){
    const icons = ['❤️', '💖', '🐾', '🌹', '✨', '💕', '🍓'];
    for(let i=0; i<7; i++){
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = icons[Math.floor(Math.random() * icons.length)];
      heart.style.left = (x + (Math.random() * 44 - 22)) + 'px';
      heart.style.top = (y + (Math.random() * 20 - 10)) + 'px';
      heart.style.setProperty('--tx', (Math.random() * 90 - 45) + 'px');
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 2200);
    }
  }

  function spawnPaws(){
    const paw = document.createElement('div');
    paw.className = 'floating-heart';
    paw.textContent = '🐾';
    paw.style.left = (window.innerWidth / 2 + (Math.random() * 60 - 30)) + 'px';
    paw.style.top = (window.innerHeight / 2 + 50) + 'px';
    paw.style.setProperty('--tx', (Math.random() * 40 - 20) + 'px');
    document.body.appendChild(paw);
    setTimeout(() => paw.remove(), 2000);
  }

  /* ---------- PARILTILI YILDIZ & KALP TOZU TUVALİ ---------- */
  (function initCanvas(){
    const cvs = document.getElementById('stars-canvas');
    const ctx = cvs.getContext('2d');
    let w, h, pts = [];

    function resize(){
      w = cvs.width = window.innerWidth;
      h = cvs.height = window.innerHeight;
      pts = [];
      const cnt = Math.floor((w * h) / 11000);
      for(let i=0; i<cnt; i++){
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.6 + .4,
          a: Math.random(),
          s: Math.random() * .015 + .006
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function loop(){
      ctx.clearRect(0,0,w,h);
      for(const p of pts){
        p.a += p.s;
        const alpha = Math.abs(Math.sin(p.a)) * .75 + .15;
        ctx.fillStyle = `rgba(255, 179, 193, ${alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(loop);
    }
    loop();
  })();

})();
</script>
