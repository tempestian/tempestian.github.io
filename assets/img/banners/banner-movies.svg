<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="movBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="flare" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="160" fill="url(#movBg)"/>
  
  <!-- Film Strip Perforations (Top and Bottom) -->
  <g fill="#ffffff" opacity="0.12">
    <!-- Top row -->
    <rect x="20" y="8" width="14" height="10" rx="2"/>
    <rect x="50" y="8" width="14" height="10" rx="2"/>
    <rect x="80" y="8" width="14" height="10" rx="2"/>
    <rect x="110" y="8" width="14" height="10" rx="2"/>
    <rect x="140" y="8" width="14" height="10" rx="2"/>
    <rect x="170" y="8" width="14" height="10" rx="2"/>
    <rect x="200" y="8" width="14" height="10" rx="2"/>
    <rect x="230" y="8" width="14" height="10" rx="2"/>
    <rect x="260" y="8" width="14" height="10" rx="2"/>
    <rect x="290" y="8" width="14" height="10" rx="2"/>
    <rect x="320" y="8" width="14" height="10" rx="2"/>
    <rect x="350" y="8" width="14" height="10" rx="2"/>
    <rect x="380" y="8" width="14" height="10" rx="2"/>
    <rect x="410" y="8" width="14" height="10" rx="2"/>
    <rect x="440" y="8" width="14" height="10" rx="2"/>
    <rect x="470" y="8" width="14" height="10" rx="2"/>
    <rect x="500" y="8" width="14" height="10" rx="2"/>
    <rect x="530" y="8" width="14" height="10" rx="2"/>
    <rect x="560" y="8" width="14" height="10" rx="2"/>
    <!-- Bottom row -->
    <rect x="20" y="142" width="14" height="10" rx="2"/>
    <rect x="50" y="142" width="14" height="10" rx="2"/>
    <rect x="80" y="142" width="14" height="10" rx="2"/>
    <rect x="110" y="142" width="14" height="10" rx="2"/>
    <rect x="140" y="142" width="14" height="10" rx="2"/>
    <rect x="170" y="142" width="14" height="10" rx="2"/>
    <rect x="200" y="142" width="14" height="10" rx="2"/>
    <rect x="230" y="142" width="14" height="10" rx="2"/>
    <rect x="260" y="142" width="14" height="10" rx="2"/>
    <rect x="290" y="142" width="14" height="10" rx="2"/>
    <rect x="320" y="142" width="14" height="10" rx="2"/>
    <rect x="350" y="142" width="14" height="10" rx="2"/>
    <rect x="380" y="142" width="14" height="10" rx="2"/>
    <rect x="410" y="142" width="14" height="10" rx="2"/>
    <rect x="440" y="142" width="14" height="10" rx="2"/>
    <rect x="470" y="142" width="14" height="10" rx="2"/>
    <rect x="500" y="142" width="14" height="10" rx="2"/>
    <rect x="530" y="142" width="14" height="10" rx="2"/>
    <rect x="560" y="142" width="14" height="10" rx="2"/>
  </g>

  <!-- Cinema Projector Beams -->
  <polygon points="50,20 550,60 550,100 50,140" fill="#38bdf8" opacity="0.08"/>
  
  <!-- Anamorphic Lens Flare Line (Across the center) -->
  <line x1="0" y1="80" x2="600" y2="80" stroke="url(#flare)" stroke-width="3"/>
  <ellipse cx="300" cy="80" rx="40" ry="12" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="300" cy="80" rx="8" ry="8" fill="#ffffff"/>

  <!-- Minimalist Clapperboard Icon (Right side) -->
  <g transform="translate(480, 48) scale(0.85)" opacity="0.4">
    <rect x="0" y="16" width="60" height="44" rx="4" fill="#ffffff"/>
    <polygon points="0,0 60,0 52,14 0,14" fill="#ffffff"/>
    <polygon points="12,0 20,0 12,14 4,14" fill="#090d16"/>
    <polygon points="32,0 40,0 32,14 24,14" fill="#090d16"/>
    <polygon points="52,0 60,0 52,14 44,14" fill="#090d16"/>
  </g>
</svg>
