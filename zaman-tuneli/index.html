<body data-root="../" data-section="timeline">
<!-- [AI-MIMARI-NOTU: ADIM 4 — KİŞİSEL İZLEME & OKUMA ZAMAN TÜNELİ] -->
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana Sayfaya Dön" title="Ana Sayfaya Dön"></a>
    <span class="bar-title">Zaman Tüneli</span>
    <div class="bar-actions">
      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
    </div>
  </div>
</header>

<main class="wrap timeline-wrap" id="timelineApp">
  <div class="timeline-hero">
    <h1>⏳ Zaman Tüneli</h1>
    <p class="sub">Bayram Tempestian kişisel medya yolculuğu: Yıllara ve dönemlere göre izlenen ve okunan tüm yapımlar kronolojik bir akış halinde.</p>
  </div>

  <div class="timeline-controls">
    <nav class="timeline-cat-nav glass sq" aria-label="Kategori Süzgeci">
      <button type="button" class="timeline-cat-btn is-active" data-cat="all">Tümü</button>
      <button type="button" class="timeline-cat-btn" data-cat="anime">📺 Anime</button>
      <button type="button" class="timeline-cat-btn" data-cat="series">🎬 Dizi</button>
      <button type="button" class="timeline-cat-btn" data-cat="movie">🍿 Film</button>
      <button type="button" class="timeline-cat-btn" data-cat="manga">📖 Manga</button>
      <button type="button" class="timeline-cat-btn" data-cat="book">📚 Kitap</button>
    </nav>

    <div class="timeline-mode-toggle" role="group" aria-label="Zamanlama Türü">
      <button type="button" class="timeline-mode-btn is-active" data-mode="added">🗓️ İzleme / Okuma Yılına Göre</button>
      <button type="button" class="timeline-mode-btn" data-mode="release">🎬 Yapım Çıkış Yılına Göre</button>
    </div>
  </div>

  <div class="timeline-container" id="timelineMount">
    <!-- Zaman tüneli omurgası ve kartları timeline.js tarafından çizilir -->
  </div>
</main>
<nav id="dock" class="dock glass" aria-label="Bölümler" hidden></nav>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/timeline.js"></script>
