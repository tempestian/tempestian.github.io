<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#eceef3">
<meta name="description" content="Bayram Tempestian'ın izlediği filmler: Kişisel puanlar, incelemeler ve başyapıtlar.">
<!-- [AI-MIMARI-NOTU: ADIM 22 — SOSYAL MEDYA PAYLAŞIM KARTLARI (OPEN GRAPH & TWITTER)] -->
<meta property="og:site_name" content="Tempestian">
<meta property="og:type" content="website">
<meta property="og:url" content="https://tempestian.github.io/film/">
<meta property="og:title" content="Film Arşivi · Tempestian">
<meta property="og:description" content="Bayram Tempestian'ın izlediği filmler: Kişisel puanlar, incelemeler ve başyapıtlar.">
<meta property="og:image" content="https://tempestian.github.io/assets/img/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Film Arşivi · Tempestian">
<meta name="twitter:description" content="Bayram Tempestian'ın izlediği filmler: Kişisel puanlar, incelemeler ve başyapıtlar.">
<meta name="twitter:image" content="https://tempestian.github.io/assets/img/icon-512.png">
<title>Film · Tempestian</title>
<link rel="icon" href="../assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<script src="../assets/js/theme.js"></script>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-root="../" data-section="movie" data-data="../data/movies.json">
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana sayfa"></a>
    <span class="bar-title">Film</span>
    <div class="bar-actions">
      <a class="btn glass bar-stats-btn" href="istatistik/" title="Film İstatistikleri" aria-label="Film İstatistikleri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></a>
      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-head"><h1>Film</h1></div>

  <div id="stats" class="stats glass sq" hidden></div>

  <div class="tools">
    <label class="search glass">
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Film, kategori veya yönetmen ara..." autocomplete="off">
    </label>
    <div class="pick glass">
      <select id="sort" aria-label="Sıralama">
        <option value="added">Eklenme</option>
        <option value="score">Puan (Yüksekten Düşüğe)</option>
        <option value="score-asc">Puan (Düşükten Yükseğe)</option>
        <option value="title">Ad (A–Z)</option>
        <option value="year">Çıkış yılı</option>
        <option value="eps">İlerleme</option>
      </select>
      <span data-icon="chev"></span>
    </div>
    <div class="view glass" role="group" aria-label="Görünüm">
      <button type="button" data-view="grid" data-icon="grid" aria-label="Izgara görünümü" title="Izgara Görünümü" aria-pressed="true"></button>
      <button type="button" data-view="list" data-icon="list" aria-label="Liste görünümü" title="Liste Görünümü" aria-pressed="false"></button>
      <button type="button" data-view="tier" data-icon="tier" aria-label="Katman (Tier List) görünümü" title="Katman (Tier List) Görünümü" aria-pressed="false"></button>
    </div>
    <button class="btn glass" id="randomPickBtn" type="button" data-icon="dice" aria-label="Rastgele Seç" title="Rastgele bir yapım seç (🎲)"></button>
    <div class="fw">
      <button id="fbtn" class="btn glass" type="button" data-icon="filter" aria-label="Filtreler" aria-expanded="false"></button>
      <i id="fdot" class="dotn" hidden></i>
    </div>
  </div>

  <div id="fp" class="fp"><div id="fpIn" class="fp-in"></div></div>

  <div id="chips" class="chips" role="group" aria-label="Durum filtresi"></div>

  <div id="tierBoard" class="tier-board" hidden></div>
  <ul id="list" class="grid"></ul>
  <p id="empty" class="note" hidden>Henüz kayıt yok.</p>

  <p class="foot">Kapak görselleri sahiplerine aittir. Puanlar kişisel değerlendirmedir.</p>
</main>

<nav id="dock" class="dock glass" aria-label="Bölümler" hidden></nav>

<script src="../assets/js/common.js"></script>
<script src="../assets/js/media-page.js"></script>
</body>
</html>
