# ============================================================================
# [AI-MIMARI: DİZİ, FİLM, KİTAP & MANGA ÇOKLU API SENKRONİZASYONU]
# Bu iş akışı hem haftalık otomatik zamanlayıcıyla hem de Admin Panelindeki
# tetikleyiciyle sorunsuz çalışır. [skip ci] etiketiyle yarış durumunu önler.
# ============================================================================
name: Dizi, Film, Kitap & Manga Senkronu

on:
  schedule:
    - cron: '30 4 * * 0' # Her Pazar 04:30 UTC
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Tüm kategorileri zorla tara'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-multimedia
  cancel-in-progress: false

jobs:
  sync-multimedia:
    name: Çoklu Sağlayıcı API Senkronu
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bot Commit Kontrolü
        id: check_bot
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          if ([ "$LAST_AUTHOR" = "github-actions[bot]" ] || echo "$LAST_MSG" | grep -q "\[skip ci\]") && [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Node.js 22 Kurulumu
        if: steps.check_bot.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Çoklu Sağlayıcı API Senkronu (IMDb, TVMaze, OpenLibrary, AniList)
        if: steps.check_bot.outputs.skip != 'true'
        run: node scripts/sync-multimedia.mjs

      - name: Veri Bütünlüğü Doğrulaması
        if: steps.check_bot.outputs.skip != 'true'
        run: node scripts/validate-data.mjs

      - name: Değişiklik Varsa Kaydet ve Gönder
        if: steps.check_bot.outputs.skip != 'true'
        run: |
          for p in data/series.json data/movies.json data/books.json data/manga.json d f m k; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(multimedia): dizi, film, kitap, manga verileri ve kartlari guncellendi [skip ci]"
          git pull --rebase origin main
          git push
