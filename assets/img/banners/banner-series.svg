<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="serBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="160" fill="url(#serBg)"/>
  
  <!-- Subtle TV Scanlines -->
  <g stroke="#ffffff" stroke-width="0.8" opacity="0.06">
    <line x1="0" y1="10" x2="600" y2="10"/>
    <line x1="0" y1="25" x2="600" y2="25"/>
    <line x1="0" y1="40" x2="600" y2="40"/>
    <line x1="0" y1="55" x2="600" y2="55"/>
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="85" x2="600" y2="85"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="115" x2="600" y2="115"/>
    <line x1="0" y1="130" x2="600" y2="130"/>
    <line x1="0" y1="145" x2="600" y2="145"/>
  </g>

  <!-- Sound / Broadcast Frequency Waves -->
  <path d="M40,80 Q90,30 140,80 T240,80 T340,80 T440,80 T540,80" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.4"/>
  <path d="M40,80 Q90,120 140,80 T240,80 T340,80 T440,80 T540,80" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3"/>

  <!-- Television Frame Motif on Left -->
  <g transform="translate(60, 42)" opacity="0.35">
    <rect x="0" y="0" width="80" height="54" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <polygon points="32,18 52,27 32,36" fill="#ffffff"/>
  </g>

  <!-- Glowing Play / Cast Motif in Center Right -->
  <circle cx="480" cy="80" r="38" fill="#ffffff" opacity="0.06"/>
  <circle cx="480" cy="80" r="28" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.7"/>
  <polygon points="474,70 492,80 474,90" fill="#ffffff" opacity="0.9"/>
</svg>
