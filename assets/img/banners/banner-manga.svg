<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="halftone" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#18181b" opacity="0.35"/>
    </pattern>
    <linearGradient id="mangaBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="160" fill="url(#mangaBg)"/>
  <rect width="600" height="160" fill="url(#halftone)"/>
  
  <!-- Manga Action Speedlines (from center right) -->
  <g stroke="#18181b" stroke-width="1.2" opacity="0.25">
    <line x1="0" y1="0" x2="420" y2="80"/>
    <line x1="0" y1="40" x2="420" y2="80"/>
    <line x1="0" y1="80" x2="420" y2="80"/>
    <line x1="0" y1="120" x2="420" y2="80"/>
    <line x1="0" y1="160" x2="420" y2="80"/>
    <line x1="100" y1="0" x2="420" y2="80"/>
    <line x1="200" y1="0" x2="420" y2="80"/>
    <line x1="300" y1="0" x2="420" y2="80"/>
    <line x1="100" y1="160" x2="420" y2="80"/>
    <line x1="200" y1="160" x2="420" y2="80"/>
    <line x1="300" y1="160" x2="420" y2="80"/>
  </g>

  <!-- Comic Panel Borders -->
  <rect x="25" y="16" width="160" height="128" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="3"/>
  <rect x="200" y="16" width="220" height="60" rx="4" fill="#18181b"/>
  <rect x="200" y="84" width="220" height="60" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="3"/>
  <rect x="435" y="16" width="140" height="128" rx="4" fill="#ffffff" stroke="#18181b" stroke-width="3"/>

  <!-- Manga Art Accents Inside Panels -->
  <!-- Panel 1: Eye close up lines -->
  <path d="M50,75 Q100,50 150,75 Q100,100 50,75 Z" fill="none" stroke="#18181b" stroke-width="2.5"/>
  <circle cx="100" cy="75" r="14" fill="#18181b"/>
  <circle cx="104" cy="72" r="4" fill="#ffffff"/>
  
  <!-- Panel 2 (Dark): Dramatic sound effect kanji / speed text -->
  <path d="M240,46 L380,46" stroke="#ffffff" stroke-width="2" stroke-dasharray="12,6"/>
  <circle cx="310" cy="46" r="16" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Panel 3: Dialogue bubble -->
  <path d="M230,110 C230,95 260,95 280,95 C310,95 330,95 330,110 C330,122 315,128 290,128 L275,138 L280,128 C250,128 230,122 230,110 Z" fill="#ffffff" stroke="#18181b" stroke-width="2"/>
  <line x1="250" y1="108" x2="310" y2="108" stroke="#71717a" stroke-width="2"/>
  <line x1="260" y1="116" x2="300" y2="116" stroke="#71717a" stroke-width="2"/>

  <!-- Panel 4: Shading lines -->
  <g stroke="#18181b" stroke-width="1.5" opacity="0.4">
    <line x1="450" y1="30" x2="560" y2="130"/>
    <line x1="465" y1="30" x2="570" y2="120"/>
    <line x1="480" y1="30" x2="570" y2="105"/>
    <line x1="495" y1="30" x2="570" y2="90"/>
  </g>
</svg>
