name: CI/CD Pipeline (Doğrulama & Statik Kartlar)

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'assets/**'
      - '*.html'
      - 'admin/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Doğrulama ve Kart Senkronizasyonu
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Bot Commit Atlama Kontrolü
        id: check_bot
        run: |
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          if ([ "$LAST_AUTHOR" = "github-actions[bot]" ] || echo "$LAST_MSG" | grep -q "\[skip ci\]") && [ "${{ github.event_name }}" = "push" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Node.js 22 Kurulumu
        if: steps.check_bot.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Veri Bütünlüğü ve Şema Kontrolü
        if: steps.check_bot.outputs.skip != 'true'
        run: node scripts/validate-data.mjs

      - name: JS & Betik Sözdizimi Kontrolü
        if: steps.check_bot.outputs.skip != 'true'
        run: |
          node --check assets/js/common.js
          node --check assets/js/anime.js
          node --check assets/js/media-page.js
          node --check assets/js/admin.js

      - name: Paylaşım Kartlarını Üret
        if: steps.check_bot.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: node scripts/generate-share-cards.mjs

      - name: Yeni Kartları Kaydet (Değişiklik Varsa)
        if: steps.check_bot.outputs.skip != 'true' && github.event_name != 'pull_request'
        run: |
          for p in a d f m k; do
            [ -e "$p" ] && git add "$p"
          done
          if git diff --cached --quiet; then
            echo "Kartlarda değişiklik yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(cards): statik sosyal medya paylasim kartlari guncellendi [skip ci]"
          git pull --rebase origin main
          git push
