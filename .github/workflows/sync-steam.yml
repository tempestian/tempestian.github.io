name: Steam Telemetri Senkronu

on:
  schedule:
    - cron: '*/15 * * * *' # Her 15 dakikada bir otomatik
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-steam
  cancel-in-progress: false

jobs:
  sync:
    name: Steam Durum ve Oyun Senkronu
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Node.js 22 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Steam Verisini Senkronize Et
        run: node scripts/sync-steam.mjs
        env:
          STEAM_ID: '76561199415059525'
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}

      - name: Değişiklik Varsa Kaydet
        run: |
          if [ -n "$(git status --porcelain data/steam-status.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/steam-status.json
            git commit -m "chore(steam): steam telemetri durumu güncellendi [skip ci]

          Co-authored-by: Gemini <200291788+gemini-code-assist@users.noreply.github.com>"
            git push
          else
            echo "Değişiklik yok."
          fi
