<body data-root="" data-section="home">
<header class="bar">
  <div class="bar-in">
    <span class="bar-title" id="barTitle" aria-hidden="true">Tempestian</span>
    <div class="bar-actions">
      <a class="btn glass bar-stats-btn" href="zaman-tuneli/" title="Zaman Tüneli" aria-label="Zaman Tüneli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></a>

      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>

  </div>
</header>
<main class="wrap">
  <!-- [AI-MIMARI-NOTU: GRAND ARCHIVE HERO BAŞLIĞI — TENSURA ESTETİĞİ] -->
  <header class="hero grand-archive-hero" id="heroSection">
    <div class="hero-profile">
      <div class="hero-avatar-wrap">
        <img class="mark" id="heroLogo" src="assets/img/logo.png" width="52" height="52" alt="Avatar" decoding="async">
        <span class="hero-avatar-badge" title="Aktif"></span>
      </div>
      <div class="hero-profile-text">
        <span class="hero-user-tag">User Profile</span>
        <h2 class="hero-user-name" id="heroSub">Bayram</h2>
        <p class="hero-user-realm">Jura Tempest Federation</p>
      </div>
    </div>
    <div class="hero-brand">
      <h1 class="hero-grand-title" id="heroTitle">Tempestian Archive</h1>
      <p class="hero-grand-sub">Anime · Manga · Kitap · Sinema · GNU/Linux</p>
    </div>
    <div class="hero-now-widget" id="heroNowWidget">
      <div class="hnw-thumb-wrap">
        <img class="hnw-thumb" id="hnwThumb" src="assets/img/icon-192.png" width="40" height="40" alt="" decoding="async">
      </div>
      <div class="hnw-text">
        <span class="hnw-label"><span class="hab-pulse" aria-hidden="true"></span> Şimdi Aktif</span>
        <p class="hnw-activity" id="hnwActivity">🍿 One Piece &amp; Severance · 📖 Tensura LN · 🐧 Wayland &amp; NixOS</p>
      </div>
    </div>
  </header>

  <!-- [AI-MIMARI-NOTU: SÜRPRİZ KARTI — ZARİF VE DERLİ TOPLU HEDİYE ŞERİDİ] -->
  <section class="gift glass sq" id="gift" aria-label="Sürpriz">
    <button class="gift-btn" id="giftBtn" type="button" aria-expanded="false" aria-controls="giftPanel" aria-label="Sürprizi aç" title="Sürprizi okumak için tıkla ✨">
      <span class="gift-slime-icon">🎁</span>
      <span class="gift-banner-lead" id="giftLead">Hediyenin açılma zamanı geldi</span>
      <span class="gift-banner-link">Sürprizi Gör ✨</span>
    </button>
    <div class="gift-panel" id="giftPanel">
      <div class="gift-in">
        <div class="gift-body-txt">
          <div class="cd" id="giftCd" role="timer" aria-live="off" hidden>
            <div><b data-u="d">0</b><span data-ul="d">Gün</span></div>
            <div><b data-u="h">00</b><span data-ul="h">Saat</span></div>
            <div><b data-u="m">00</b><span data-ul="m">Dakika</span></div>
            <div><b data-u="s">00</b><span data-ul="s">Saniye</span></div>
          </div>
          <p class="gift-date" id="giftDate"><a href="hediye/" style="color:var(--accent);font-weight:600">Sürprizi okumak için tıkla ✨</a></p>
        </div>
      </div>
    </div>
  </section>

  <!-- [AI-MIMARI-NOTU]: Üst kutucuklar (#boxesTop), Grand Archive kartları (#sections), alt kutucuklar (#boxesBottom) ve bağlantılar (#links) -->
  <ul class="tiles custom-boxes" id="boxesTop" hidden></ul>
  <ul class="tiles grand-archive-grid" id="sections"></ul>
  <ul class="tiles custom-boxes" id="boxesBottom" hidden></ul>
  <ul class="links" id="links" aria-label="Bağlantılar"></ul>
  <noscript><p class="note">Bölümler için JavaScript gerekiyor.</p></noscript>
