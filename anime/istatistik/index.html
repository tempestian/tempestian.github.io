<script type="speculationrules">
{
  "prerender": [
    {
      "source": "list",
      "urls": [
        "/",
        "/anime/",
        "/film/",
        "/dizi/",
        "/kitap/",
        "/manga/",
        "/rehber/",
        "/projeler/",
        "/zaman-tuneli/",
        "/istatistik/",
        "/kitap/ozel/",
        "/tensura-izleme-sirasi/"
      ],
      "eagerness": "immediate"
    },
    {
      "where": {
        "and": [
          { "href_matches": "/*" },
          { "not": { "href_matches": "/admin*" } }
        ]
      },
      "eagerness": "immediate"
    }
  ]
}
</script>
