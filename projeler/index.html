<style>
#projectList.project-catalog-grid {
  display: grid !important;
  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
  gap: 16px !important;
  margin-top: 14px !important;
  list-style: none !important;
  padding: 0 !important;
}
@media (max-width: 820px) {
  #projectList.project-catalog-grid {
    grid-template-columns: 1fr !important;
  }
}
.project-card {
  grid-column: span 1 !important;
  padding: 0 !important;
  border-radius: 20px !important;
  display: flex !important;
  flex-direction: column !important;
  transition: transform 0.22s cubic-bezier(0.2, 0.9, 0.4, 1), border-color 0.2s ease, box-shadow 0.22s ease !important;
  cursor: pointer;
}
.project-card:hover {
  transform: translateY(-3px) !important;
  border-color: rgba(100, 210, 255, 0.45) !important;
  box-shadow: 0 16px 36px -4px rgba(2, 6, 18, 0.75), inset 0 1px 0 0 rgba(175, 235, 255, 0.35) !important;
}
.project-card-inner {
  display: flex !important;
  flex-direction: column !important;
  justify-content: space-between !important;
  height: 100% !important;
  padding: 22px 24px !important;
  gap: 14px !important;
  box-sizing: border-box !important;
}
.project-header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.project-badge-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.project-badge-group .tag {
  white-space: nowrap !important;
}
.project-tech-meta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.project-lang-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.74rem;
  font-weight: 600;
  color: var(--iris-ink-secondary, #a8c5eb);
  white-space: nowrap;
}
.project-lang-pill .lang-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.project-branch-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid rgba(255, 255, 255, 0.12);
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.71rem;
  font-weight: 600;
  color: var(--iris-ink-muted, #7c9dc7);
  white-space: nowrap;
}
:root[data-theme="light"] .project-branch-pill {
  background: rgba(0, 0, 0, 0.05);
  border-color: rgba(0, 0, 0, 0.1);
  color: #3b537a;
}
.tag-fork {
  background: rgba(186, 104, 200, 0.18) !important;
  border-color: rgba(186, 104, 200, 0.40) !important;
  color: #ce93d8 !important;
}
:root[data-theme="light"] .tag-fork {
  background: rgba(156, 39, 176, 0.12) !important;
  border-color: rgba(156, 39, 176, 0.30) !important;
  color: #7b1fa2 !important;
}
.project-title-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.project-name {
  font-size: 1.25rem !important;
  font-weight: 750 !important;
  line-height: 1.3 !important;
  margin: 0 !important;
  letter-spacing: -0.015em;
}
.project-name a {
  color: var(--iris-ink, #edf4ff) !important;
  text-decoration: none !important;
  transition: color 0.18s ease;
}
.project-name a:hover {
  color: var(--iris-highlight, #64d2ff) !important;
}
:root[data-theme="light"] .project-name a {
  color: #0c172a !important;
}
:root[data-theme="light"] .project-name a:hover {
  color: #0a6ee8 !important;
}
.project-upstream-line {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  color: var(--iris-ink-muted, #7c9dc7);
}
.project-upstream-line svg {
  flex-shrink: 0;
  color: var(--iris-ink-muted, #7c9dc7);
}
.project-upstream-line a {
  color: var(--iris-highlight, #64d2ff);
  text-decoration: none;
  font-weight: 600;
}
.project-upstream-line a:hover {
  text-decoration: underline;
}
:root[data-theme="light"] .project-upstream-line a {
  color: #0a6ee8;
}
.project-desc {
  font-size: 0.88rem !important;
  line-height: 1.58 !important;
  color: var(--iris-ink-secondary, #a8c5eb) !important;
  margin: 0 !important;
}
:root[data-theme="light"] .project-desc {
  color: #2e4a73 !important;
}
.project-pills-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.pill-chip {
  display: inline-flex;
  align-items: center;
  padding: 3px 9px;
  border-radius: 6px;
  background: rgba(59, 158, 255, 0.08);
  border: 1px solid rgba(86, 182, 255, 0.16);
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--iris-highlight, #64d2ff);
  white-space: nowrap;
}
:root[data-theme="light"] .pill-chip {
  background: rgba(15, 76, 156, 0.06);
  border-color: rgba(15, 76, 156, 0.15);
  color: #0a6ee8;
}
.project-terminal-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  background: rgba(2, 6, 18, 0.85);
  border: 1px solid rgba(86, 182, 255, 0.18);
  cursor: copy;
  transition: all 0.18s ease;
  overflow: hidden;
  box-sizing: border-box;
}
.project-terminal-bar:hover {
  background: rgba(2, 6, 18, 0.98);
  border-color: rgba(100, 210, 255, 0.45);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
}
:root[data-theme="light"] .project-terminal-bar {
  background: #edf4fc;
  border-color: rgba(86, 140, 210, 0.25);
}
:root[data-theme="light"] .project-terminal-bar:hover {
  background: #e2edfa;
  border-color: rgba(86, 140, 210, 0.45);
}
.term-prompt {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.78rem;
  font-weight: 700;
  color: var(--iris-highlight, #64d2ff);
  user-select: none;
}
:root[data-theme="light"] .term-prompt {
  color: #0a6ee8;
}
.term-code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.72rem;
  color: #9cd5ff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
:root[data-theme="light"] .term-code {
  color: #0b5cab;
}
.term-copy-btn {
  background: none;
  border: none;
  color: var(--iris-ink-muted, #7c9dc7);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 4px;
  border-radius: 4px;
  cursor: pointer;
  transition: color 0.18s ease;
  flex-shrink: 0;
}
.term-copy-btn:hover {
  color: #ffffff;
}
:root[data-theme="light"] .term-copy-btn:hover {
  color: #0c172a;
}
.project-footer-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 2px;
  padding-top: 12px;
  border-top: 1px solid rgba(86, 182, 255, 0.14);
}
.project-date {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--iris-ink-muted, #6e8fb8);
}
.btn-github-out {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px !important;
  border-radius: 9px !important;
  background: rgba(59, 158, 255, 0.14) !important;
  border: 1px solid rgba(100, 210, 255, 0.32) !important;
  color: var(--iris-highlight, #64d2ff) !important;
  font-size: 0.76rem !important;
  font-weight: 650 !important;
  text-decoration: none !important;
  transition: all 0.2s ease;
}
.btn-github-out svg {
  flex-shrink: 0;
}
.project-card:hover .btn-github-out {
  background: linear-gradient(180deg, #2578e4 0%, #1552a8 100%) !important;
  border-color: rgba(145, 222, 255, 0.65) !important;
  color: #ffffff !important;
}
</style>
</head>
<body data-root="../" data-section="project" data-data="../data/projects.json">
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana sayfa"></a>
    <span class="bar-title">Projeler</span>
    <div class="bar-actions">
      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Projeler</h1>
    <p class="sub" id="projectPageSub" style="margin-top:4px;font-size:.98rem">Açık kaynak sistem yapılandırmaları, kabuk forkları ve yazılım projeleri kataloğu.</p>
  </div>

  <div id="stats" class="stats glass sq" hidden></div>

  <div class="tools">
    <label class="search glass">
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Proje adı, teknoloji veya anahtar kelime ara..." autocomplete="off">
    </label>
    <div class="pick glass">
      <select id="sort" aria-label="Sıralama">
        <option value="added">En yeni</option>
        <option value="title">İsim (A–Z)</option>
        <option value="fav">Öne çıkanlar</option>
      </select>
      <span data-icon="chev"></span>
    </div>
    <button class="btn glass" id="randomPickBtn" type="button" data-icon="dice" aria-label="Rastgele Proje Seç" title="Rastgele bir proje seç (🎲)"></button>
  </div>

  <div id="chips" class="chips" role="group" aria-label="Kategori ve Teknoloji Filtresi"></div>

  <ul id="projectList" class="tiles project-catalog-grid"></ul>
  <p id="empty" class="note" hidden>Henüz proje eklenmemiş veya aramayla eşleşen proje yok.</p>

  <p class="foot">Tüm projeler açık kaynaklıdır. Proje kartlarına tıklayarak doğrudan ilgili GitHub deposuna gidebilirsiniz.</p>
</main>

<nav id="dock" class="dock glass" aria-label="Bölümler" hidden></nav>

<script src="../assets/js/common.js?v=2.2"></script>
<script src="../assets/js/project.js?v=2.2"></script>
</body>
</html>
