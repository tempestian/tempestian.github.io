<title>Projeler · Tempestian</title>
<link rel="icon" href="../assets/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="../assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css?v=4.0">
<style>
#projectList.project-catalog-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin-top: 14px;
  list-style: none;
  padding: 0;
}
@media (max-width: 820px) {
  #projectList.project-catalog-grid { grid-template-columns: 1fr; }
}
.project-card {
  padding: 0;
  border-radius: var(--radius-md);
  background: var(--surface);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  cursor: pointer;
  transition: transform 180ms var(--ease), border-color 180ms var(--ease), background 180ms var(--ease);
}
.project-card:hover {
  transform: translateY(-3px);
  background: var(--surface-2);
  border-color: var(--border-strong);
}
.project-card-inner {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  height: 100%;
  padding: 20px 22px;
  gap: 14px;
}
.project-badge-group, .project-tech-meta, .project-pills-row {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.tag-fork {
  background: rgba(168, 85, 247, 0.16);
  border-color: rgba(168, 85, 247, 0.34);
  color: #c084fc;
}
.project-title-block { display: flex; flex-direction: column; gap: 4px; }
.project-name a { color: var(--ink); }
.project-name a:hover { color: var(--accent); }
.project-upstream-line {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.76rem;
  color: var(--ink3);
}
.project-upstream-line a { color: var(--accent); font-weight: 600; }
.project-upstream-line a:hover { text-decoration: underline; }
.term-prompt { color: var(--accent); font-weight: 700; user-select: none; }
</style>
</head>
<body data-root="../" data-section="project" data-data="../data/projects.json">
<header class="bar">
  <div class="bar-in">
    <a class="btn glass" href="../" data-icon="back" aria-label="Ana sayfa"></a>
    <span class="bar-title">Projeler</span>
    <div class="bar-actions">
      <button class="btn glass" id="theme" type="button" data-icon="theme" aria-label="Tema"></button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>Projeler</h1>
    <p class="sub" id="projectPageSub" style="margin-top:4px;font-size:.98rem">Açık kaynak sistem yapılandırmaları, kabuk forkları ve yazılım projeleri kataloğu.</p>
  </div>

  <div id="stats" class="stats glass sq" hidden></div>

  <div class="tools">
    <label class="search glass">
      <span data-icon="search"></span>
      <input id="q" type="search" placeholder="Proje adı, teknoloji veya anahtar kelime ara..." autocomplete="off">
    </label>
    <div class="pick glass">
      <select id="sort" aria-label="Sıralama">
        <option value="added">En yeni</option>
        <option value="title">İsim (A–Z)</option>
        <option value="fav">Öne çıkanlar</option>
      </select>
      <span data-icon="chev"></span>
    </div>
    <button class="btn glass" id="randomPickBtn" type="button" data-icon="dice" aria-label="Rastgele Proje Seç" title="Rastgele bir proje seç (🎲)"></button>
  </div>

  <div id="chips" class="chips" role="group" aria-label="Kategori ve Teknoloji Filtresi"></div>

  <ul id="projectList" class="tiles project-catalog-grid"></ul>
  <p id="empty" class="note" hidden>Henüz proje eklenmemiş veya aramayla eşleşen proje yok.</p>

  <p class="foot">Tüm projeler açık kaynaklıdır. Proje kartlarına tıklayarak doğrudan ilgili GitHub deposuna gidebilirsiniz.</p>
</main>

<nav id="dock" class="dock glass" aria-label="Bölümler" hidden></nav>

<script src="../assets/js/common.js?v=4.0"></script>
<script src="../assets/js/project.js?v=4.0"></script>
</body>
</html>
